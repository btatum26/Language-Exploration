name: Quality

on:
  push:
  pull_request:

jobs:
  registry-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry-aligner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -m "not postgresql"
      - run: uv run ruff check .
      - run: uv run python -m compileall -q src

  registry-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_align_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registry_align_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: registry-aligner
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/registry_align_test
      REGISTRY_ALIGN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/registry_align_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -m postgresql

  qt-projects:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-xinerama0 libdbus-1-3
      - working-directory: spectrogram-playground
        run: uv sync --extra dev
      - working-directory: spectrogram-playground
        run: uv run pytest
      - working-directory: spectrogram-playground
        run: uv run ruff check .
      - working-directory: spectrogram-playground
        run: uv run python -m compileall -q spectrogram_playground
      - working-directory: alignment-workbench
        run: uv sync --group dev
      - working-directory: alignment-workbench
        run: uv run pytest
      - working-directory: alignment-workbench
        run: uv run ruff check .
      - working-directory: alignment-workbench
        run: uv run python -m compileall -q src
