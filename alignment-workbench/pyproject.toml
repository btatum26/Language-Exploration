[project]
name = "alignment-workbench"
version = "0.1.0"
description = "Signal-first audio annotation workbench"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgresql: requires an explicit disposable PostgreSQL target"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
