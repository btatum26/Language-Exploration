[project]
name = "alignment-workbench"
version = "0.1.0"
description = "Signal-first audio annotation workbench"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
