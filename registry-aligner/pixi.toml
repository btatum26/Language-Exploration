[workspace]
name = "registry-aligner"
version = "0.1.0"
description = "Registry alignment environment with MFA and its native dependencies"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.13.*"
ffmpeg = "*"
montreal-forced-aligner = ">=3.4,<4"

[activation.env]
MFA_ROOT_DIR = ".mfa"
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

[pypi-dependencies]
registry-aligner = { path = ".", editable = true }
pytest = ">=8.4,<9"
ruff = ">=0.12,<1"
mypy = ">=1.16,<1.18"

[tasks]
doctor = "registry-align doctor --config registry-align.example.toml"
models = { depends-on = ["dictionary"] }
download-models = "mfa model download acoustic italian_cv && mfa model download dictionary italian_cv"
dictionary = { cmd = "registry-align build-italian-dictionary ../recordings/complete_italian_pronunciation_registry/registry.json --config registry-align.example.toml --base-dictionary .mfa/pretrained_models/dictionary/italian_cv.dict --output .mfa/generated/italian_cv_registry.dict", depends-on = ["download-models"] }
validate = "registry-align validate ../recordings/complete_italian_pronunciation_registry/registry.json --config registry-align.example.toml"
pilot = "registry-align process ../recordings/complete_italian_pronunciation_registry/registry.json --config registry-align.example.toml --output ../recordings/complete_italian_pronunciation_registry/alignment-output --select it_basics_001_luca --jobs 1 --fail-fast"
process = "registry-align process ../recordings/complete_italian_pronunciation_registry/registry.json --config registry-align.example.toml --output ../recordings/complete_italian_pronunciation_registry/alignment-output --jobs 4"
status = "registry-align status ../recordings/complete_italian_pronunciation_registry/alignment-output"
qc = "registry-align qc ../recordings/complete_italian_pronunciation_registry/alignment-output"
export = "registry-align export ../recordings/complete_italian_pronunciation_registry/alignment-output --format csv --format textgrid"
test = "pytest -p no:cacheprovider"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
