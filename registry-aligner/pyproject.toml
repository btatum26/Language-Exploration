[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "registry-aligner"
version = "0.1.0"
description = "Backend-independent registry ingestion and forced-alignment CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "epitran>=1.35,<2",
    "pydantic>=2.11,<3",
    "rich>=14,<16",
    "typer>=0.16,<1",
]

[project.scripts]
registry-align = "registry_align.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.16,<1.18",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/registry_align"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
