schema_version = "2"

[input]
entries_path = "recordings"
id_path = "id"
audio_path = "audio.path"
transcript_path = "transcript.text"
language_path = "transcript.language"
speaker_path = "speaker_id"
metadata_paths = ["lesson_id", "lesson_number", "category", "target_sound"]

[defaults]
language = "it"

[source]
corpus_id = "italian-pronunciation"
root = "../recordings/complete_italian_pronunciation_registry"

[artifacts]
root = ".registry-align-cache"

[remote_audio]
ssh_host = "registry-db"
ssh_executable = "ssh"
scp_executable = "scp"
root = "~/registry-align/audio"
operation_timeout_seconds = 300
batch_size = 24
upload_workers = 2

[audio]
editor_pcm_mode = "native"
alignment_sample_rate_hz = 16000
alignment_channels = 1
ffmpeg_executable = "ffmpeg"
ffprobe_executable = "ffprobe"
preparation_version = "1"

[text]
normalizer = "italian"
unicode_form = "NFC"
lowercase = true

[alignment]
backend = "mfa"
jobs = 4
continue_on_error = true
pipeline_version = "1"
claim_lease_seconds = 3600

[alignment.mfa]
executable = "mfa"
config_path = "mfa-wide-beam.yaml"
model_mode = "auto"
acoustic_model = "italian_cv"
dictionary = ".mfa/generated/italian_cv_registry.dict"
g2p_model = ""
use_g2p_for_oov = false
fine_tune = false
validate_corpus = true
dialect = ""

[database]
pool_size = 3
max_overflow = 1
pool_timeout_seconds = 10
connect_timeout_seconds = 10
statement_timeout_ms = 30000

[database.ssh_tunnel]
enabled = true
host = "registry-db"
executable = "ssh"
local_host = "127.0.0.1"
local_port = 5433
startup_timeout_seconds = 5.0

[retention]
prune_runs = true
run_metadata_days = 30
minimum_runs_to_keep = 10
failed_run_days = 14

[output]
directory = "exports"
formats = ["jsonl"]
