[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spectrogram-playground"
version = "0.1.0"
description = "A native multitrack workspace for educational voice acoustics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "librosa>=0.11,<1",
  "numpy>=2.0,<3",
  "pyqtgraph>=0.13.7,<1",
  "PySide6>=6.8,<7",
  "scipy>=1.14,<2",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
spectrogram-playground = "src.application:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
